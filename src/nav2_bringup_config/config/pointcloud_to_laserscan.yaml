pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "body"              # 直接用 body 坐标系，避免 TF 转换问题
    transform_tolerance: 0.1
    min_height: -0.5                   # 过滤地面以下噪声
    max_height: 2.0                    # 过滤天花板以上噪声
    angle_min: -3.14159               # -180°
    angle_max: 3.14159                # +180°
    angle_increment: 0.0087           # 约 0.5° 分辨率
    scan_time: 0.1
    range_min: 0.1
    range_max: 30.0
    use_inf: false                     # 禁用 inf，避免 RViz LaserScan 插件渲染异常
    inf_epsilon: 0.01
